[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "marimo-md-export"
version = "0.10.1"
description = "A minimal solution for exporting marimo notebooks to markdown *with* rendered HTML outputs, designed for mkdocs/zensical sites."
authors = [
    { name = "Joe Marsh Rossney", email = "17361029+jmarshrossney@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "marimo>=0.23.3",
    "typer>=0.25.0",
]
keywords = ["marimo", "markdown", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://jmarshrossney.github.io/marimo-md-export"
Repository = "https://github.com/jmarshrossney/marimo-md-export"
Documentation = "https://jmarshrossney.github.io/marimo-md-export"

[project.scripts]
marimo-md-export = "marimo_md_export:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "rust-just>=1.50.0",
    {include-group = "docs"},
    {include-group = "test"},
]
docs = [
    "mkdocs-typer2>=0.4.1",
    "zensical>=0.0.37",
]
examples = [
    "graphviz>=0.21",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
]
test = [
    "coverage>=7.13.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    {include-group = "examples"},
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# Pinned to what ruff selected by default before 0.16 broadened it, so the
# rule set cannot change under us on a version bump. Worth knowing before
# widening this: the new defaults clash with generated and framework code —
# PLR1711/B018/I001 fight the marimo cell format in examples/notebook.py
# (B018 flags the bare-expression render idiom and has no fix), and B008
# flags typer.Argument/Option in argument defaults.
select = ["E4", "E7", "E9", "F"]

[tool.uv]
exclude-newer = "1 week"
